apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-policy-rag-agent
  namespace: default
  labels:
    app: loan-policy-rag-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loan-policy-rag-agent
  template:
    metadata:
      labels:
        app: loan-policy-rag-agent
    spec:
      serviceAccountName: loan-policy-agent
      containers:
        - name: agent
          image: us-central1-docker.pkg.dev/genai-ai-agents-project/loan-closure/a2a-rag:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: genai-ai-agents-project
            - name: GOOGLE_CLOUD_LOCATION
              value: us-central1
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "TRUE"
            - name: A2A_RAG_PORT
              value: "8080"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: loan-policy-rag-agent
  namespace: default
  labels:
    app: loan-policy-rag-agent
  annotations:
    cloud.google.com/backend-config: '{"default":"loan-policy-rag-backend"}'
spec:
  type: ClusterIP
  selector:
    app: loan-policy-rag-agent
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
